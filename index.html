<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Certified Data Engineer Professional — Practice Exam 2</title>
<style>
  :root{
    --ink:#131b23;
    --ink-soft:#4b5a68;
    --paper:#f2f4f6;
    --card:#ffffff;
    --line:#d7dee5;
    --ok:#0f6b4f;
    --ok-bg:#e6f3ed;
    --no:#9a3b32;
    --no-bg:#f6ebea;
    --mark:#1e4f7a;
    --shadow:0 1px 0 rgba(19,27,35,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px;
    line-height:1.75;
  }
  header{
    background:var(--ink);
    color:#eef2f5;
    padding:34px 22px 26px;
  }
  .wrap{max-width:860px;margin:0 auto}
  h1{
    margin:0 0 6px;
    font-size:1.45rem;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.4;
  }
  .sub{margin:0;color:#9fb1c0;font-size:.85rem}
  .stats{margin-top:18px;display:flex;gap:26px;flex-wrap:wrap;font-size:.82rem;color:#9fb1c0}
  .stats b{color:#fff;font-size:1.5rem;font-weight:700;display:block;line-height:1.2}
  .controls{
    position:sticky;top:0;z-index:10;
    background:rgba(242,244,246,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 22px;
  }
  .ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search]{
    flex:1;min-width:180px;
    padding:8px 12px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font:inherit;font-size:.86rem;color:var(--ink);
  }
  input[type=search]:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  button{
    font:inherit;font-size:.82rem;cursor:pointer;
    padding:8px 14px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
  }
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:26px 22px 90px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .qhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .qnum{font-size:1.05rem;font-weight:700;color:var(--mark)}
  .domain{
    font-size:.72rem;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:4px;padding:2px 8px;
  }
  .qtext{margin:0 0 16px;font-size:.97rem}
  .code-block{
    white-space:pre-wrap;word-break:break-word;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:.82rem;line-height:1.5;
    background:#f5f5f7;border:1px solid var(--line);border-radius:6px;
    padding:10px 12px;margin:8px 0;overflow-x:auto;display:block;
  }
  ol.opts{list-style:none;margin:0;padding:0;counter-reset:o}
  ol.opts li{
    counter-increment:o;
    border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:9px;background:#fcfdfd;
  }
  li.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt-t{display:flex;gap:10px;font-size:.9rem}
  .opt-t::before{
    content:counter(o,upper-alpha);
    font-weight:700;color:var(--ink-soft);flex:none;
  }
  li.correct .opt-t::before{color:var(--ok)}
  .verdict{
    display:inline-block;margin-top:9px;font-size:.72rem;font-weight:700;
    padding:2px 8px;border-radius:4px;
  }
  .v-ok{background:var(--ok);color:#fff}
  .v-no{background:var(--no-bg);color:var(--no)}
  .exp{margin:7px 0 0;font-size:.85rem;color:var(--ink-soft)}
  .exp-ja{
    margin-top:5px;padding-left:10px;
    border-left:2px solid #c9d4de;color:#3d4f5f;
  }
  .ov-ja{
    margin:8px 0 0;padding-top:8px;
    border-top:1px dashed #c2d0dd;color:#33475a;
  }
  body.hide-answers .exp-ja{display:none}
  .card.shown .exp-ja{display:block!important}
  .overall{
    margin-top:16px;padding:14px 16px;border-left:3px solid var(--mark);
    background:#f4f7fa;border-radius:0 8px 8px 0;font-size:.88rem;
  }
  .overall h4{margin:0 0 6px;font-size:.76rem;color:var(--mark);font-weight:700}
  .jp{
    margin-top:12px;padding:12px 16px;border-radius:8px;
    background:#fff8ec;border:1px solid #f0e0c2;font-size:.88rem;
  }
  .jp h4{margin:0 0 4px;font-size:.76rem;color:#8a6a2c;font-weight:700}
  body.hide-answers li.correct{border-color:var(--line);background:#fcfdfd}
  body.hide-answers .verdict,
  body.hide-answers .exp,
  body.hide-answers .overall,
  body.hide-answers .jp{display:none}
  .reveal{margin-top:12px;display:none;font-size:.78rem;padding:6px 12px}
  .card.shown .reveal{background:var(--ink);color:#fff;border-color:var(--ink)}
  body.hide-answers .reveal{display:inline-block}
  .card.shown li.correct{border-color:var(--ok)!important;background:var(--ok-bg)!important}
  .card.shown .verdict,.card.shown .exp,.card.shown .overall,.card.shown .jp{display:block!important}
  .card.shown .verdict{display:inline-block!important}
  .empty{text-align:center;color:var(--ink-soft);padding:40px}
  @media print{
    .controls{display:none}
    body{background:#fff}
    .card{break-inside:avoid;box-shadow:none}
  }
</style>
</head>
<body class="hide-answers">
<header>
  <div class="wrap">
    <h1>Databricks Certified Data Engineer Professional<br>Practice Exam 2</h1>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="ctl-row">
      <input type="search" id="search" placeholder="キーワード検索（例: Auto Loader, CDF, ウォーターマーク）">
      <button id="toggle-ans" class="on">すべての解答を表示</button>
      <button id="expand-all" style="display:none">全部表示</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap" id="list"></div>
  <div class="wrap empty" id="empty" style="display:none">該当する問題がありません。</div>
</main>

<script>
const DATA = [
{
n:1, d:"Unity Catalog・ガバナンス",
q:"パスワードを Unity Catalog のマネージドテーブルに安全に保存したい。SHA2(password, 256) でハッシュ化してから保存し、ハッシュ値全体を格納できるよう列の長さ制約も設定する必要がある。「spark123」と「ApacheSpark111」の2つの文字列をハッシュ化してテストした場合、結果のハッシュ長についてどうなりますか。",
o:[
 {t:"数字の文字数に依存するため両方とも同じ長さになる", c:false, e:"ハッシュ長は入力に含まれる数字の文字数とは無関係。"},
 {t:"入力サイズに関わらず両方とも同じ長さになる", c:true, e:"正解。SHA-256 は入力の長さに関わらず常に256ビットの出力を生成する。16進文字列で表すと常に64文字になる。"},
 {t:"「spark123」のハッシュのほうが「ApacheSpark111」より短くなる", c:false, e:"暗号学的ハッシュ関数は入力長に関わらず固定長を出力する。"},
 {t:"「ApacheSpark111」のハッシュのほうが「spark123」より短くなる", c:false, e:"同上。長さの差は生じない。"}
],
ov:"両方のハッシュが同じ長さになる理由は、暗号学的ハッシュ関数の設計そのものにある。SHA-256 は入力の長短に関わらず常に256ビットの出力を生成する。これは暗号学的ハッシュ関数の基本的な性質で、任意サイズの入力を固定長の出力へ写像する。16進文字列で表現する場合(ハッシュの保存で標準的な方法)、256ビットのハッシュは常に64文字になる。したがってこの設問では、列制約は64文字に対応できるよう設定すべきである。",
jp:"SHA-256＝常に64文字(16進)。SHA-224/256/384/512 のビット数と16進文字数の対応(224→56文字、256→64文字、384→96文字、512→128文字)も余裕があれば覚えておく。"
},
{
n:2, d:"パフォーマンス最適化",
q:"Unity Catalog に保存されているユーザー活動イベントテーブルに対し、user_id と event_date の両方でフィルタするクエリが多く発行されます。高コストなテーブルスキャンを避けるために実装すべきデータレイアウト技術はどれですか。",
o:[
 {t:"event_date 列でパーティションする", c:false, e:"日付でのフィルタは助けるが user_id でのフィルタは最適化されず、パーティション内でフルスキャンが起きうる。"},
 {t:"user_id 列でパーティションし、event_date 列に Z-order インデックスを付ける", c:false, e:"両方のフィルタに対応できるが、ユーザー数が多いと小さなパーティションが大量に発生し、管理・性能上の問題を招く。"},
 {t:"user_id に Z-order インデックスを付ける", c:false, e:"user_id のフィルタは最適化されるが event_date のフィルタは考慮されず、日付フィルタ時のスキャンが非効率になる。"},
 {t:"user_id と event_date の組み合わせで Liquid Clustering を使う", c:true, e:"正解。Liquid Clustering は両方の列に基づいてデータレイアウトを増分的に最適化し、両方の列でのフィルタを効率的にサポートしながら高コストなテーブルスキャンを避けられる。"}
],
ov:"このシナリオでは、user_id と event_date の組み合わせで Liquid Clustering を使うのが高コストなスキャンを避ける最良の選択。この技術は両方の列に基づいてデータレイアウトを増分的に最適化し、両列でのフィルタを効率的にサポートする。event_date のみのパーティションは日付フィルタには有効だが user_id のフィルタは最適化されず、パーティション内でフルスキャンが起きる可能性がある。user_id への Z-order は user_id のフィルタを最適化するが event_date のフィルタは無視され、日付でフィルタする際に非効率なスキャンが生じる。最後に、user_id でのパーティションと event_date への Z-order の組み合わせは両方の列でのフィルタをサポートするが、ユーザー数が多い場合に多数の小さなパーティションを生み、管理と性能の問題を引き起こしうる。",
jp:"複数列に対する予測不能・多様なフィルタ＝Liquid Clustering(複合キー)。パーティション＋Z-orderの組み合わせは小パーティション問題を招くことがある、という点が新しい論点。"
},
{
n:3, d:"Structured Streaming",
q:"Auto Loader を使ったストリーミング取り込みパイプラインを設計しています。要件は、スキーマ変更があってもパイプラインが決して失敗せず、届いた新しい列を後で調査できるよう捕捉することです。使うべき設定はどれですか。",
o:[
 {t:"none", c:false, e:"スキーマ進化を無効化するモードで、新しい列が来ると失敗する。"},
 {t:"addNewColumns", c:false, e:"新しい列を自動的にスキーマへ追加するモードで、ストリームは再起動が必要になり、要求される『決して失敗しない』挙動とは異なる。"},
 {t:"rescue", c:true, e:"正解。rescue モードはスキーマを進化させないため新しい列が来てもストリームは失敗しない。新しい列は rescued data 列に格納され、ストリームを中断せずに後で調査できる。"},
 {t:"failOnNewColumns", c:false, e:"新しい列が検出されるとストリームを失敗させるモードで、要件と正反対。"}
],
ov:"rescue モードはスキーマを進化させないため、新しい列が追加されてもストリームは失敗しない。代わりに、新しい列はすべて rescued data 列に保存され、ストリームを中断することなく後で調査できる。これにより、ストリームを失敗なく稼働させ続けつつ、新しいスキーマ要素も捕捉するという要件を満たせる。",
jp:"schemaEvolutionMode の4種類：addNewColumns(既定・列追加で再起動)、rescue(失敗しない・列は rescued_data へ退避)、failOnNewColumns(失敗させる)、none(進化させず既存スキーマに合わせる)。"
},
{
n:4, d:"ジョブ・ワークフロー",
q:"既存のクラスターを起動し、ノートブックをアタッチするために必要な最小限の権限はどれですか。",
o:[
 {t:"クラスター作成権限＋クラスターに対する「Can Restart」権限", c:false, e:"クラスター作成権限は新規作成のためのものであり、既存クラスターの起動には不要。"},
 {t:"クラスターに対する「Can Attach To」権限", c:false, e:"Can Attach To はノートブックのアタッチはできるが、停止しているクラスターの起動(再起動)はできない。"},
 {t:"クラスターに対する「Can Restart」権限", c:true, e:"正解。Can Restart はクラスターの起動・再起動・終了ができ、ノートブックのアタッチも含む。"},
 {t:"クラスターに対する「Can Manage」権限", c:false, e:"Can Manage で足りるが、それより下位の Can Restart で必要十分であり、これが最小限の権限。"}
],
ov:"クラスター権限には2種類ある。①「Allow cluster creation」entitlement はクラスターを作成できるかを制御する。②クラスターレベルの権限は特定クラスターの利用・変更を制御し、No Permissions / Can Attach To / Can Restart / Can Manage の4段階がある。起動(既に停止しているクラスターの再起動を含む)とアタッチには Can Restart が必要。",
jp:"Exam1 Q22 と対になる問題。『設定編集』はCan Manage、『起動+アタッチ』はCan Restart、『アタッチのみ(稼働中への接続)』はCan Attach To。段階を正確に区別する。"
},
{
n:5, d:"Delta Lake",
q:"SCD Type 1 の Delta Lake テーブルを管理しています。ジュニアエンジニアがテーブルディレクトリ内に '_change_data' という名前のフォルダを見つけました。このフォルダの用途を説明しているのはどれですか。",
o:[
 {t:"すべての SCD Type 1 テーブルは、テーブルデータへの更新を追跡するために '_change_data' フォルダを持つ", c:false, e:"SCD の型に関わらず、このフォルダは CDF が有効な場合にのみ存在する。"},
 {t:"テーブルで CDF 機能が有効になっている。'_change_data' フォルダは CDF のデータが保存される場所である", c:true, e:"正解。Databricks は UPDATE・DELETE・MERGE 操作の変更データをテーブルディレクトリ配下の _change_data フォルダに記録する。"},
 {t:"'_change_data' フォルダはスキーマ定義の変化を追跡する既定のディレクトリである", c:false, e:"スキーマ変更の追跡ではなく行レベルの変更データを保存する場所。"},
 {t:"テーブルで Optimized Writes 機能が有効になっている。'_change_data' フォルダは最適化されたデータが保存される場所である", c:false, e:"Optimized Writes とは無関係。"}
],
ov:"Databricks は UPDATE・DELETE・MERGE 操作の変更データを、テーブルディレクトリ配下の _change_data フォルダに記録する。このフォルダ内のファイルはテーブルの保持ポリシーに従うため、VACUUM コマンドを実行すると Change Data Feed のデータも削除される。",
jp:"_change_data フォルダの存在＝CDF が有効な証拠。VACUUM を実行すると CDF データも削除される点(Q31とも関連)を必ずセットで覚える。"
},
{
n:6, d:"Delta Lake",
q:"Kafka のソースデータを topic と month でパーティションされた Multiplex Bronze テーブルへ取り込むパイプラインがあります。'user_activity' トピックには、会社の SLA に基づき2か月ごとに削除すべき個人識別情報(PII)が含まれています。テーブルパーティションがこの要件をどう助けるか説明しているのはどれですか。",
o:[
 {t:"テーブルパーティションにより削除クエリがパーティション境界を活用できる", c:true, e:"正解。日時列でのパーティションは、一定の古さを超えたデータを削除する際に活用でき、削除はパーティション境界に沿ってきれいに行える。"},
 {t:"テーブルパーティションにより、削除後の PII データをタイムトラベルできなくなる", c:false, e:"パーティションの有無とタイムトラベルの可否は直接関係しない。"},
 {t:"テーブルパーティションは、大きなデータファイルを削除する際のクエリレイテンシを削減する", c:false, e:"パーティションの主な利点はクエリレイテンシの削減自体ではなく、境界に沿った削除の効率化。"},
 {t:"テーブルパーティションにより、VACUUM コマンドを実行せずに即座にファイルを削除できる", c:false, e:"ファイルの物理削除には依然として VACUUM が必要。"}
],
ov:"日時列でのパーティションは、一定の古さを超えたデータをテーブルから削除する際に活用できる。たとえば数か月前のデータを削除すると決めた場合、ファイルの削除はパーティション境界に沿ってきれいに行われる。同様に、パーティション境界単位でデータをより安価なストレージ層へアーカイブ・バックアップすることもでき、クラウドストレージの大きな節約につながる。",
jp:"PII の定期削除(コンプライアンス対応)には日時パーティションが効く、という実務的な理由。GDPR対応(Exam1 Q18)とは異なるアプローチ(個別DELETEではなくパーティション単位の削除)である点に注意。"
},
{
n:7, d:"ジョブ・ワークフロー",
q:"上流のデータソースの問題でスケジュールされたジョブが失敗しました。問題を解決した後、次のスケジュール実行を待たずに Jobs API で同じジョブを再度トリガーしたい場合、正しい REST API 呼び出しはどれですか。",
o:[
 {t:"POST を '/api/2.2/jobs/start' へ送る", c:false, e:"そのようなエンドポイントは存在しない。"},
 {t:"POST を '/api/2.2/jobs/run' へ送る", c:false, e:"エンドポイント名が誤り。"},
 {t:"GET を '/api/2.2/jobs/run' へ送る", c:false, e:"メソッドもエンドポイントも誤り。"},
 {t:"POST を '/api/2.2/jobs/run-now' へ送る", c:true, e:"正解。run-now エンドポイントに POST を送ると job_id を使ってジョブの実行をトリガーできる。"}
],
ov:"'/api/2.2/jobs/run-now' に POST リクエストを送ることで、job_id を使ってジョブの実行をトリガーできる。",
jp:"作成・実行系は POST：run-now(即時実行)、create(ジョブ作成)、runs/submit(一回限りの実行)。一覧・詳細取得系は GET(Exam1 Q54, Exam2 Q42と対応)。"
},
{
n:8, d:"ジョブ・ワークフロー",
q:"失敗したマルチタスクジョブの実行を修復(Repair run)する際、Repair run ダイアログでタスクパラメータの値を変更してから実行しました。この変更の効果を最もよく説明しているのはどれですか。",
o:[
 {t:"この機能は新しいパラメータの追加のみをサポートし既存の更新はサポートしないため、修復実行は失敗する", c:false, e:"既存パラメータの値も変更できる。"},
 {t:"更新したパラメータはこの修復実行にのみ適用され、ジョブに保存された設定は変更されない", c:true, e:"正解。Repair run ダイアログでの変更は、その特定の実行にのみ適用され、ジョブの元の設定を上書きしない。"},
 {t:"更新したパラメータ値はジョブ設定に恒久的に保存される", c:false, e:"恒久的な変更にするには、ジョブ設定自体を別途更新する必要がある。"},
 {t:"ジョブのパラメータが常に実行のパラメータより優先されるため、この変更は無視される", c:false, e:"変更は無視されず、その修復実行には反映される。"}
],

n:19, d:"Lakeflow SDP",
q:"SDP パイプラインで、bronze_products テーブルの一部レコードが無効な価格(ゼロまたは負)を持っています。これに対応するため、次のコードを実装しました。\n\n@dlt.table\n@dlt.expect_or_drop(\"positive_price\", \"price > 0\")\ndef silver_products():\n    return spark.readStream.table(\"bronze_products\")\n\n@dlt.table\n@dlt.expect_or_drop(\"invalid_price\", \"price <= 0\")\ndef quarantine_products():\n    return spark.readStream.table(\"bronze_products\")\n\nこのパイプラインの実行結果を正しく説明しているのはどれですか。",
o:[
 {t:"価格が正のレコードは silver_products に読み込まれ、ゼロまたは負のレコードは bronze_products から削除される", c:false, e:"bronze_products 自体からレコードが削除されるわけではない。"},
 {t:"すべてのレコードが bronze_products で更新され、価格が有効かどうかを示す 'quarantine_products' フラグが付く", c:false, e:"bronze_products 自体は更新されない。"},
 {t:"価格が正のレコードは silver_products に読み込まれ、ゼロまたは負のレコードは quarantine_products に読み込まれる", c:true, e:"正解。silver_products は price > 0 を満たす行のみを保持し、quarantine_products は price <= 0 を満たす行のみを保持するため、レコードは価格の正負によって振り分けられる。"},
 {t:"すべてのレコードが silver_products に読み込まれ、価格が有効かどうかを示す 'quarantine_products' フラグが付く", c:false, e:"expect_or_drop は行を落とすため、すべてが1つのテーブルに残ることはない。"}
],
ov:"このパイプラインは、無効なレコードを保存する2つ目のテーブルを作る隔離のよくあるパターンを使っている。silver_products は @dlt.expect_or_drop(\"positive_price\", \"price > 0\") を使っており、price > 0 を満たすレコードのみが保持され、ゼロまたは負の価格のレコードは削除される。結果として silver_products には価格が正の有効な商品レコードのみが含まれ、下流の処理はビジネスルールに準拠したクリーンなデータを受け取れる。一方 quarantine_products は @dlt.expect_or_drop(\"invalid_price\", \"price <= 0\") で定義されており、price <= 0 のレコードのみがこの期待値を満たして保持される。これにより無効な価格のレコードすべてが後の検査・修正のために隔離テーブルへ振り分けられる。元の bronze_products テーブルは変更されず、レコードが削除されることもない。",
jp:"exect_or_drop を2つの逆条件のテーブルに適用することで『振り分け』を実現するパターン。Exam1 Q38(expect_all＝落とさず両方保持)との違いを明確に。ここは drop なので2テーブルに完全分離される。"

 {t:"GRANT ALL PRIVILEGES ON TABLE employees TO hr_team", c:true, e:"正解。ALL PRIVILEGES はオブジェクトに対する完全な権限をユーザーやグループへ付与するために使う。"},
 {t:"GRANT SELECT, MODIFY, CREATE, READ_METADATA ON TABLE employees TO hr_team", c:false, e:"USAGE が抜けており、ALL PRIVILEGES が含む権限のすべてを網羅していない。"},

],
ov:"ALL PRIVILEGES は、ユーザーやグループへオブジェクトに対する完全な権限を付与するために使う。これは以下のすべての権限に変換される：SELECT、CREATE、MODIFY、USAGE、READ_METADATA。",
jp:"ALL PRIVILEGES が展開される5つの権限を覚える：SELECT / CREATE / MODIFY / USAGE / READ_METADATA。個別に列挙する選択肢では USAGE が抜けている、という細部の引っかけに注意。"
}
];

const TRANS = {};

const list = document.getElementById('list');
const search = document.getElementById('search');
const toggleAns = document.getElementById('toggle-ans');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(s){ const e = esc(s); return e.includes('\n') ? `<span class="code-block">${e}</span>` : e; }

function render(){
  const term = search.value.trim().toLowerCase();
  const rows = DATA.filter(item => {
    if (!term) return true;
    const blob = (item.q + item.ov + item.jp + item.o.map(o => o.t + o.e).join(' ')).toLowerCase();
    return blob.includes(term);
  });

  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  list.innerHTML = rows.map(item => {
    const tr = TRANS[item.n] || {};
    return `
    <article class="card" id="q${item.n}">
      <div class="qhead">
        <span class="qnum">Q${item.n}</span>
        <span class="domain">${esc(item.d)}</span>
      </div>
      <p class="qtext">${fmt(item.q)}</p>
      <ol class="opts">
        ${item.o.map((o, i) => `
          <li class="${o.c ? 'correct' : ''}">
            <div class="opt-t"><span>${fmt(o.t)}</span></div>
            <span class="verdict ${o.c ? 'v-ok' : 'v-no'}">${o.c ? '正解' : '誤り'}</span>
            <p class="exp">${esc(o.e)}</p>
            ${tr.o && tr.o[i] ? `<p class="exp exp-ja">${esc(tr.o[i])}</p>` : ''}
          </li>`).join('')}
      </ol>
      <button class="reveal" onclick="toggleCard(this)">解答を表示</button>
      <div class="overall"><h4>Overall explanation</h4>${esc(item.ov)}
        ${tr.ov ? `<p class="ov-ja">${esc(tr.ov)}</p>` : ''}
      </div>
      <div class="jp"><h4>覚えるポイント</h4>${esc(item.jp)}</div>
    </article>`;
  }).join('');
}

function toggleCard(btn){
  const card = btn.closest('.card');
  const shown = card.classList.toggle('shown');
  btn.textContent = shown ? '解答を隠す' : '解答を表示';
}

toggleAns.onclick = () => {
  const hidden = document.body.classList.toggle('hide-answers');
  toggleAns.textContent = hidden ? 'すべての解答を表示' : 'すべての解答を隠す';
  toggleAns.classList.toggle('on', hidden);
  document.querySelectorAll('.card.shown').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.reveal').forEach(b => b.textContent = '解答を表示');
};
search.oninput = render;
render();
</script>
</body>
</html>
